<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Matrix Загрузка</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      background: #000;
      color: #0f0;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
    }

    .loader {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100%;
    }

    .logo {
      width: 120px;
      height: 120px;
      margin-bottom: 24px;
      animation: pulse 2.5s infinite ease-in-out;
      filter: drop-shadow(0 0 12px #0f0);
      border-radius: 50%;
    }

    .text {
      font-size: 1.5rem;
      letter-spacing: 2px;
      color: #0f0;
      text-shadow: 0 0 6px #0f0, 0 0 12px #0f0;
      animation: flicker 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 8px #0f0);
      }
      50% {
        transform: scale(1.08);
        filter: drop-shadow(0 0 20px #0f0);
      }
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo, .text { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="matrix" aria-hidden="true"></canvas>

  <div class="loader">
    <img src="matrix.png" class="logo" alt="Matrix logo" />
    <div class="text" role="status">Загрузка Matrix...</div>
  </div>

  <script>
    const RAIN_CHARACTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^%";
    const RAIN_COLOR = "#0f0";
    const FONT_SIZE_PX = 16;
    const FRAME_INTERVAL_MS = 50;
    const TRAIL_OPACITY = 0.05;
    const DROP_RESTART_THRESHOLD = 0.975;
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    let width;
    let height;
    let drops;
    let animationTimer;

    function draw() {
      ctx.fillStyle = `rgba(0, 0, 0, ${TRAIL_OPACITY})`;
      ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = RAIN_COLOR;
      ctx.font = FONT_SIZE_PX + "px monospace";

      for (let i = 0; i < drops.length; i++) {
        const text = RAIN_CHARACTERS[Math.floor(Math.random() * RAIN_CHARACTERS.length)];
        ctx.fillText(text, i * FONT_SIZE_PX, drops[i] * FONT_SIZE_PX);
        if (drops[i] * FONT_SIZE_PX > height && Math.random() > DROP_RESTART_THRESHOLD) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    function drawStillRain() {
      // Paint one complete trail without moving it when motion is reduced.
      const trailRows = Math.ceil(height / FONT_SIZE_PX);
      for (let row = 0; row < trailRows; row++) draw();
    }

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      drops = Array(Math.floor(width / FONT_SIZE_PX)).fill(1);
      if (reducedMotion.matches) drawStillRain();
    }

    function updateMotion() {
      clearInterval(animationTimer);
      resizeCanvas();
      if (!reducedMotion.matches) animationTimer = setInterval(draw, FRAME_INTERVAL_MS);
    }

    updateMotion();
    window.addEventListener("resize", resizeCanvas);
    reducedMotion.addEventListener("change", updateMotion);
    window.addEventListener("pagehide", () => {
      clearInterval(animationTimer);
      window.removeEventListener("resize", resizeCanvas);
      reducedMotion.removeEventListener("change", updateMotion);
    }, { once: true });
  </script>
</body>
</html>
